# ====================================
# Test Configuration
# Uses H2 in-memory database
# ====================================

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT test secret
app.jwt.secret=test-secret-key-for-unit-tests-must-be-at-least-256-bits-long-for-hs256-algorithm
app.jwt.expiration-ms=3600000

# Disable Spring Security verbose logging in tests
logging.level.org.springframework.security=ERROR

# Document storage path for tests
document.storage.path=./target/test-storage/documents

