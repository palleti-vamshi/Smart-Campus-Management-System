# ====================================
# Smart Campus Management System
# Application Configuration
# ====================================

spring.application.name=SmartCampus

# ====================================
# MySQL Database Configuration
# ====================================
spring.datasource.url=jdbc:mysql://localhost:3306/smart_campus?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ====================================
# JPA / Hibernate
# ====================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ====================================
# JWT Configuration
# ====================================
app.jwt.secret=${JWT_SECRET:default-dev-secret-key-change-in-production-this-must-be-at-least-256-bits-long}
app.jwt.expiration-ms=86400000

# ====================================
# Server Configuration
# ====================================
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# ====================================
# Logging
# ====================================
logging.level.com.smartcampus=INFO
logging.level.org.springframework.security=WARN
